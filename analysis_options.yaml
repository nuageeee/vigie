# Static analysis: `dart analyze` (also run by the CI).
# Base: the recommended lints from package:lints, plus a few stricter rules
# that catch mistakes we actually made.

include: package:lints/recommended.yaml

linter:
  rules:
    - always_declare_return_types   # a function without a return type returns `dynamic` silently
    - prefer_final_locals           # `var` that never changes should be `final`
    - prefer_const_declarations     # fixed values should be `const`
    - unawaited_futures             # a Future that is neither awaited nor handled
    - avoid_print                   # no stray debug prints in a TUI
